name: Auto VPN Russia

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python main.py
      - run: |
          git config user.email "vpn-bot@github.com"
          git config user.name "Auto VPN Bot"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
